# Optional overlay for a profile where `dsh-auth` is already resolvable but is
# intentionally not listed as a bundle. Do not apply this with cordis.patch.yml.
# Same dormancy rule as cordis.patch.yml: both core file variables absent
# keeps the row disabled so `dsh plugin add` pre-install never breaks Web.
- insert:
    - id: dsh-auth
      name: dsh-auth
      disabled: !!js process.env.DSH_AUTH_STATE_FILE === undefined && process.env.DSH_AUTH_SESSION_SECRET_FILE === undefined
      config:
        authStateFile: !!js process.env.DSH_AUTH_STATE_FILE
        sessionSecretFile: !!js process.env.DSH_AUTH_SESSION_SECRET_FILE
        loginTokenEnabled: !!js JSON.parse(process.env.DSH_AUTH_LOGIN_TOKEN_ENABLED ?? 'false')
        loginTokenDirectory: !!js process.env.DSH_AUTH_LOGIN_TOKEN_DIRECTORY
        loginTokenFailureMessageZh: !!js process.env.DSH_AUTH_LOGIN_TOKEN_FAILURE_MESSAGE_ZH
        loginTokenFailureMessageEn: !!js process.env.DSH_AUTH_LOGIN_TOKEN_FAILURE_MESSAGE_EN
        secureCookies: !!js JSON.parse(process.env.DSH_AUTH_SECURE_COOKIES ?? 'true')
        sessionTtlSeconds: !!js Number(process.env.DSH_AUTH_SESSION_TTL_SECONDS ?? 259200)
        idleTtlSeconds: !!js Number(process.env.DSH_AUTH_IDLE_TTL_SECONDS ?? 259200)
        sessionRenewalSeconds: !!js Number(process.env.DSH_AUTH_SESSION_RENEWAL_SECONDS ?? 3600)
        maxSessions: !!js Number(process.env.DSH_AUTH_MAX_SESSIONS ?? 16)
        loginWindowSeconds: !!js Number(process.env.DSH_AUTH_LOGIN_WINDOW_SECONDS ?? 60)
        loginMaxAttempts: !!js Number(process.env.DSH_AUTH_LOGIN_MAX_ATTEMPTS ?? 5)
        loginBlockSeconds: !!js Number(process.env.DSH_AUTH_LOGIN_BLOCK_SECONDS ?? 300)
        loginTokenWindowSeconds: !!js Number(process.env.DSH_AUTH_LOGIN_TOKEN_WINDOW_SECONDS ?? 60)
        loginTokenMaxAttempts: !!js Number(process.env.DSH_AUTH_LOGIN_TOKEN_MAX_ATTEMPTS ?? 10)
        loginTokenBlockSeconds: !!js Number(process.env.DSH_AUTH_LOGIN_TOKEN_BLOCK_SECONDS ?? 300)
        trustedProxyAddresses: !!js (process.env.DSH_AUTH_TRUSTED_PROXY_ADDRESSES ?? '127.0.0.1,::1').split(',').map(value => value.trim()).filter(Boolean)

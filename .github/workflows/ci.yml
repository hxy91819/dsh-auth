name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce production code health
        run: pnpm run check:code-health
      - name: Generate code health reports
        if: success() || failure()
        run: pnpm run report:code-health
      - name: Upload code health reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-health-reports
          path: .tmp/code-health/
          if-no-files-found: error
          retention-days: 90

  functional:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - run: pnpm run check:functional

  pack:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    outputs:
      tarball: ${{ steps.packed.outputs.tarball }}
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm pack --pack-destination packed
      - id: packed
        run: |
          set -euo pipefail
          tarball="$(find packed -maxdepth 1 -type f -name 'dsh-auth-*.tgz' -printf '%f\n')"
          test "$(printf '%s\n' "$tarball" | wc -l)" -eq 1
          echo "tarball=$tarball" >> "$GITHUB_OUTPUT"
      - run: node scripts/pack-smoke.mjs "packed/${{ steps.packed.outputs.tarball }}"
      - uses: actions/upload-artifact@v7
        with:
          name: packed-tarball
          path: packed/*.tgz
          if-no-files-found: error
          retention-days: 1
      - run: npm pack --dry-run

  e2e-installer:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install PTY support
        run: sudo apt-get update && sudo apt-get install --yes util-linux
      - run: pnpm install --frozen-lockfile
      - uses: actions/download-artifact@v8
        with:
          name: packed-tarball
          path: packed
      - run: node scripts/installer-e2e.mjs "packed/${{ needs.pack.outputs.tarball }}"

  e2e:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile gitignored lib for the checkout E2E helper
        run: pnpm run build
      - uses: actions/download-artifact@v8
        with:
          name: packed-tarball
          path: packed
      - run: pnpm run test:e2e -- "packed/${{ needs.pack.outputs.tarball }}"

  e2e-behind-tls-proxy:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Compile gitignored lib for the checkout E2E helper
        run: pnpm run build
      - uses: actions/download-artifact@v8
        with:
          name: packed-tarball
          path: packed
      - run: pnpm run test:e2e:behind-tls-proxy -- "packed/${{ needs.pack.outputs.tarball }}"

  e2e-lifecycle:
    needs: pack
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: actions/download-artifact@v8
        with:
          name: packed-tarball
          path: packed
      - uses: ./.github/actions/systemd-lifecycle-e2e
        with:
          tarball: packed/${{ needs.pack.outputs.tarball }}

  check:
    if: ${{ !cancelled() }}
    needs:
      - functional
      - pack
      - e2e-installer
      - e2e
      - e2e-behind-tls-proxy
      - e2e-lifecycle
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every packed check job
        env:
          FUNCTIONAL: ${{ needs.functional.result }}
          PACK: ${{ needs.pack.result }}
          E2E_INSTALLER: ${{ needs.e2e-installer.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_BEHIND_TLS_PROXY: ${{ needs.e2e-behind-tls-proxy.result }}
          E2E_LIFECYCLE: ${{ needs.e2e-lifecycle.result }}
        run: |
          set -euo pipefail
          failed=0
          for name in FUNCTIONAL PACK E2E_INSTALLER E2E E2E_BEHIND_TLS_PROXY E2E_LIFECYCLE; do
            eval "result=\${$name}"
            printf '%s=%s\n' "$name" "$result"
            if [ "$result" != success ]; then failed=1; fi
          done
          exit "$failed"

name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.sha }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  secrets:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Scan for committed secrets
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

  code-health:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Enforce production code health
        run: pnpm run check:code-health
      - name: Generate code health reports
        if: success() || failure()
        run: pnpm run report:code-health
      - name: Upload code health reports
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: code-health-reports
          path: .tmp/code-health/
          if-no-files-found: error
          retention-days: 90

  check:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v7
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes nginx util-linux
      - run: nginx -v
      - run: pnpm install --frozen-lockfile
      - name: Audit production and development dependencies
        run: pnpm audit --audit-level high
      - run: pnpm run check:functional
      - run: pnpm run check:nginx
      - run: pnpm pack --pack-destination packed
      - run: node scripts/pack-smoke.mjs packed/dsh-auth-*.tgz
      - run: node scripts/installer-e2e.mjs packed/dsh-auth-*.tgz
      - run: pnpm run test:e2e -- packed/dsh-auth-*.tgz
      - run: pnpm run test:e2e:behind-tls-proxy -- packed/dsh-auth-*.tgz
      - name: Run packed managed lifecycle E2E in systemd
        run: |
          set -euo pipefail
          IMAGE="dsh-auth-systemd-e2e:${GITHUB_SHA}"
          CONTAINER="dsh-auth-systemd-e2e-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}"
          TARBALL="$(find "$PWD/packed" -maxdepth 1 -type f -name 'dsh-auth-*.tgz' -print -quit)"
          docker build --file .github/systemd-e2e.Dockerfile --tag "$IMAGE" .github
          docker run --detach --init=false --privileged --security-opt label=disable \
            --name "$CONTAINER" --tmpfs /run --tmpfs /run/lock --tmpfs /tmp \
            --volume "$PWD:/source:ro" "$IMAGE"
          cleanup() { docker rm --force "$CONTAINER" >/dev/null 2>&1 || true; }
          trap cleanup EXIT
          for attempt in {1..30}; do
            STATE="$(docker exec "$CONTAINER" systemctl is-system-running 2>/dev/null || true)"
            if [ "$STATE" = running ] || [ "$STATE" = degraded ]; then break; fi
            sleep 1
          done
          [[ "$STATE" == "running" || "$STATE" == "degraded" ]]
          docker exec "$CONTAINER" bash -lc 'mkdir /checkout && cp -a /source/. /checkout/'
          docker exec --env "LIFECYCLE_TARBALL_BASE=/checkout/packed/$(basename "$TARBALL")" \
            "$CONTAINER" bash -lc 'cd /checkout && corepack pnpm run test:e2e:lifecycle'
      - run: npm pack --dry-run

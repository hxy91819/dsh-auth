name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10.14.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
      - run: sudo apt-get update && sudo apt-get install --yes nginx
      - run: nginx -v
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check
      - run: pnpm run check:nginx
      - run: pnpm pack --pack-destination packed
      - run: npm pack --dry-run

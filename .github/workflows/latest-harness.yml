name: Latest Harness compatibility

on:
  schedule:
    - cron: '17 3 * * *'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  latest-harness:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: pnpm/action-setup@v6
        with:
          version: 10.14.0
      - uses: actions/setup-node@v7
        with:
          node-version: 24.15.0
          cache: pnpm
      - name: Install Nginx and PTY support
        run: sudo apt-get update && sudo apt-get install --yes nginx util-linux
      - run: pnpm install --frozen-lockfile
      - name: Verify npm latest Harness through the canonical E2E
        run: pnpm run test:e2e:latest-dsh

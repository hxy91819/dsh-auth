name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag to publish
        required: true
        type: string

permissions: {}

concurrency:
  group: npm-release-${{ inputs.tag }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  NPM_VERSION: 12.0.2
  PNPM_VERSION: 10.14.0
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    steps:
      - name: Require the main workflow ref
        if: github.ref != 'refs/heads/main'
        run: |
          echo '::error::Release must be dispatched from the main workflow ref.' >&2
          exit 1

      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up the pinned npm 12 release CLI
        run: |
          npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Validate the stable tag and main ancestry
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs source --tag "$RELEASE_TAG"

      - name: Install PTY support
        run: sudo apt-get update

      - name: Install PTY support packages
        run: sudo apt-get install --yes util-linux

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check

      - name: Run Caddy configuration checks
        run: pnpm run check:caddy

      - name: Run tracked-file privacy gate
        run: node scripts/release-validation.mjs privacy

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Release pack uses --ignore-scripts, so prepack does not vendor Caddy.
      # The packer lives in the tag checkout; this step is required before inspect.
      - name: Vendor official Caddy binaries for the release tarball
        run: node scripts/pack-caddy-platform.mjs --clean

      - name: Create and inspect the single release artifact
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-validation.mjs pack \
            --tag "$RELEASE_TAG" \
            --directory release \
            --manifest release/manifest.json \
            --report release/pack-report.json

      - name: Verify the committed changelog and generate release notes
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-changelog.mjs check \
            --tag "$RELEASE_TAG" \
            --target "refs/tags/$RELEASE_TAG" \
            --output CHANGELOG.md \
            --notes release/release-notes.md \
            --repository "$GITHUB_REPOSITORY"

      - name: Run offline packed-bin smoke
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="./release/dsh-auth-${RELEASE_VERSION}.tgz"
          node scripts/pack-smoke.mjs "$TARBALL"

      - name: Run packed interactive and non-interactive PTY E2E
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="release/dsh-auth-${RELEASE_VERSION}.tgz"
          node scripts/installer-e2e.mjs "$TARBALL"

      - name: Run packed authentication E2E through DSH, Caddy, and Chrome
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="release/dsh-auth-${RELEASE_VERSION}.tgz"
          pnpm run test:e2e -- "$TARBALL"

      - name: Run packed authentication E2E behind an outer TLS proxy
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="release/dsh-auth-${RELEASE_VERSION}.tgz"
          pnpm run test:e2e:behind-tls-proxy -- "$TARBALL"

      - name: Require and test the current npm latest Harness
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="release/dsh-auth-${RELEASE_VERSION}.tgz"
          pnpm run test:e2e:latest-dsh -- "$TARBALL"

      - name: Upload the verified release artifact and manifest
        uses: actions/upload-artifact@v7
        with:
          name: dsh-auth-release
          path: |
            release/*.tgz
            release/manifest.json
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  publish:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v7
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release

      - name: Revalidate tag, artifact, manifest, and SHA-256
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs artifact-verify --tag "$RELEASE_TAG" --directory release --manifest release/manifest.json

      - name: Create an empty npm user config
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
        run: |
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_USERCONFIG"
          chmod 600 "$NPM_USERCONFIG"

      - name: Install the pinned npm 12 release CLI with Trusted Publishing support
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
        run: |
          npm --userconfig "$NPM_USERCONFIG" install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Require the exact version to be absent
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs registry-absent --tag "$RELEASE_TAG"

      - name: Publish the exact tarball with npm Trusted Publishing
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="./release/dsh-auth-${RELEASE_VERSION}.tgz"
          npm --userconfig "$NPM_USERCONFIG" publish "$TARBALL" \
            --access public \
            --tag latest \
            --provenance \
            --registry "$NPM_REGISTRY"

      - name: Verify the published version and latest tag (publication cannot be rolled back)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-validation.mjs registry-published --tag "$RELEASE_TAG"
          node scripts/release-validation.mjs registry-smoke --tag "$RELEASE_TAG"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the published npm artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-auth-release
          path: release

      - name: Revalidate tag, npm registry state, artifact, and SHA-256
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-validation.mjs artifact-verify \
            --tag "$RELEASE_TAG" \
            --directory release \
            --manifest release/manifest.json
          node scripts/release-validation.mjs registry-published --tag "$RELEASE_TAG"

      - name: Create the final GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release create "$RELEASE_TAG" \
              "release/dsh-auth-${RELEASE_TAG#v}.tgz" \
              release/manifest.json \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md; then
            echo 'Release creation did not complete; requiring an existing exact release before success.'
          fi

      - name: Download and verify the final GitHub Release (creation cannot be rolled back automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir published-release
          gh release download "$RELEASE_TAG" --dir published-release
          gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,isPrerelease,name,tagName \
            > release-metadata.json
          cmp release/manifest.json published-release/manifest.json
          node scripts/release-validation.mjs artifact-verify \
            --tag "$RELEASE_TAG" \
            --directory published-release \
            --manifest published-release/manifest.json
          node scripts/release-validation.mjs github-release \
            --tag "$RELEASE_TAG" \
            --metadata release-metadata.json \
            --notes release/release-notes.md

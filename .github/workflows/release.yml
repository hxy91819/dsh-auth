name: Release

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing stable vX.Y.Z tag to publish. Ignored when dry_run is true.
        required: false
        type: string
      dry_run:
        description: Pack and run packed E2E from this workflow ref. Never publish to npm.
        required: false
        type: boolean
        default: false

permissions: {}

concurrency:
  group: ${{ inputs.dry_run == true && format('release-dry-run-{0}', github.ref) || format('npm-release-{0}', inputs.tag) }}
  cancel-in-progress: false

env:
  NODE_VERSION: 24.15.0
  NPM_VERSION: 12.0.2
  PNPM_VERSION: 10.14.0
  NPM_REGISTRY: https://registry.npmjs.org/

jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    permissions:
      contents: read
    outputs:
      ref: ${{ steps.identity.outputs.ref }}
      tarball: ${{ steps.identity.outputs.tarball }}
      version: ${{ steps.identity.outputs.version }}
    steps:
      - name: Require a real release to use main and a stable tag
        if: ${{ inputs.dry_run != true }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
          WORKFLOW_REF: ${{ github.ref }}
        run: |
          set -euo pipefail
          if [ "$WORKFLOW_REF" != 'refs/heads/main' ]; then
            echo '::error::Release must be dispatched from the main workflow ref.' >&2
            exit 1
          fi
          if [ -z "$RELEASE_TAG" ]; then
            echo '::error::Release requires an existing stable tag input.' >&2
            exit 1
          fi

      - name: Check out the release source
        uses: actions/checkout@v7
        with:
          ref: ${{ inputs.dry_run == true && github.sha || format('refs/tags/{0}', inputs.tag) }}
          fetch-depth: 0
          persist-credentials: false

      - name: Record the packed identity
        id: identity
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            VERSION="$(node -p 'require("./package.json").version')"
            echo "version=$VERSION" >> "$GITHUB_OUTPUT"
            echo "tarball=dsh-auth-${VERSION}.tgz" >> "$GITHUB_OUTPUT"
            echo "ref=$GITHUB_SHA" >> "$GITHUB_OUTPUT"
          else
            echo "version=${RELEASE_TAG#v}" >> "$GITHUB_OUTPUT"
            echo "tarball=dsh-auth-${RELEASE_TAG#v}.tgz" >> "$GITHUB_OUTPUT"
            echo "ref=refs/tags/${RELEASE_TAG}" >> "$GITHUB_OUTPUT"
          fi

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Set up the pinned npm 12 release CLI
        run: |
          npm install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}

      - name: Validate the stable tag and main ancestry
        if: ${{ inputs.dry_run != true }}
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs source --tag "$RELEASE_TAG"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Run repository checks
        run: pnpm run check

      # The tagged systemd template keeps its production log path during validation.
      - name: Prepare the disposable managed Caddy log directory
        run: sudo install -d -o "$(id -u)" -g "$(id -g)" /var/lib/dsh-auth-caddy

      - name: Run Caddy configuration checks
        run: pnpm run check:caddy

      - name: Run tracked-file privacy gate
        run: node scripts/release-validation.mjs privacy

      - name: Run gitleaks
        uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ github.token }}

      # Release pack uses --ignore-scripts, so prepack does not vendor Caddy.
      # The packer lives in the tag checkout; this step is required before inspect.
      - name: Vendor official Caddy binaries for the release tarball
        run: node scripts/pack-caddy-platform.mjs --clean

      - name: Create and inspect the single release artifact
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            node scripts/release-validation.mjs pack --source head \
              --directory release \
              --manifest release/manifest.json \
              --report release/pack-report.json
          else
            node scripts/release-validation.mjs pack \
              --tag "$RELEASE_TAG" \
              --directory release \
              --manifest release/manifest.json \
              --report release/pack-report.json
          fi

      - name: Verify the committed changelog and generate release notes
        if: ${{ inputs.dry_run != true }}
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-changelog.mjs check \
            --tag "$RELEASE_TAG" \
            --target "refs/tags/$RELEASE_TAG" \
            --output CHANGELOG.md \
            --notes release/release-notes.md \
            --repository "$GITHUB_REPOSITORY"

      - name: Write dry-run notes instead of a GitHub Release body
        if: ${{ inputs.dry_run == true }}
        run: printf '%s\n' 'Dry-run; not a GitHub Release.' > release/release-notes.md

      - name: Run offline packed-bin smoke
        run: node scripts/pack-smoke.mjs "./release/${{ steps.identity.outputs.tarball }}"

      - name: Upload the verified release artifact and manifest
        uses: actions/upload-artifact@v7
        with:
          name: dsh-auth-release
          path: |
            release/*.tgz
            release/manifest.json
            release/release-notes.md
          if-no-files-found: error
          retention-days: 7

  e2e-installer:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install PTY support
        run: sudo apt-get update && sudo apt-get install --yes util-linux
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release
      - name: Run packed interactive and non-interactive PTY E2E
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          node scripts/installer-e2e.mjs "release/${{ needs.preflight.outputs.tarball }}"

  e2e:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release
      - name: Run packed authentication E2E through DSH, Caddy, and Chrome
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pnpm run test:e2e -- "release/${{ needs.preflight.outputs.tarball }}"

  e2e-behind-tls-proxy:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release
      - name: Run packed authentication E2E behind an outer TLS proxy
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pnpm run test:e2e:behind-tls-proxy -- "release/${{ needs.preflight.outputs.tarball }}"

  e2e-lifecycle:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release
      - name: Revalidate the packed artifact
        env:
          DRY_RUN: ${{ inputs.dry_run }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          if [ "$DRY_RUN" = true ]; then
            node scripts/release-validation.mjs artifact-verify --source head \
              --directory release --manifest release/manifest.json
          else
            node scripts/release-validation.mjs artifact-verify --tag "$RELEASE_TAG" \
              --directory release --manifest release/manifest.json
          fi
      - uses: ./.github/actions/systemd-lifecycle-e2e
        with:
          tarball: release/${{ needs.preflight.outputs.tarball }}

  e2e-latest-dsh:
    needs: preflight
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: read
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false
      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}
      - name: Set up pnpm
        uses: pnpm/action-setup@v6
        with:
          version: ${{ env.PNPM_VERSION }}
      - name: Install dependencies
        run: pnpm install --frozen-lockfile
      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release
      - name: Require and test the current npm latest Harness
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          pnpm run test:e2e:latest-dsh -- "release/${{ needs.preflight.outputs.tarball }}"

  dry-run:
    if: ${{ inputs.dry_run == true && !cancelled() }}
    needs:
      - preflight
      - e2e-installer
      - e2e
      - e2e-behind-tls-proxy
      - e2e-lifecycle
      - e2e-latest-dsh
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Confirm packed checks without publishing
        env:
          PREFLIGHT: ${{ needs.preflight.result }}
          E2E_INSTALLER: ${{ needs.e2e-installer.result }}
          E2E: ${{ needs.e2e.result }}
          E2E_BEHIND_TLS_PROXY: ${{ needs.e2e-behind-tls-proxy.result }}
          E2E_LIFECYCLE: ${{ needs.e2e-lifecycle.result }}
          E2E_LATEST_DSH: ${{ needs.e2e-latest-dsh.result }}
        run: |
          set -euo pipefail
          failed=0
          for name in PREFLIGHT E2E_INSTALLER E2E E2E_BEHIND_TLS_PROXY E2E_LIFECYCLE E2E_LATEST_DSH; do
            eval "result=\${$name}"
            printf '%s=%s\n' "$name" "$result"
            if [ "$result" != success ]; then failed=1; fi
          done
          if [ "$failed" -ne 0 ]; then exit 1; fi
          echo 'Release dry-run passed; npm was not published.'

  publish:
    if: ${{ inputs.dry_run != true }}
    needs:
      - preflight
      - e2e-installer
      - e2e
      - e2e-behind-tls-proxy
      - e2e-lifecycle
      - e2e-latest-dsh
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment:
      name: npm-release
    permissions:
      contents: read
      id-token: write
    steps:
      - name: Check out the packed source
        uses: actions/checkout@v7
        with:
          ref: ${{ needs.preflight.outputs.ref }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v7
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the preflight artifact
        uses: actions/download-artifact@v8
        with:
          name: dsh-auth-release
          path: release

      - name: Revalidate tag, artifact, manifest, and SHA-256
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs artifact-verify --tag "$RELEASE_TAG" --directory release --manifest release/manifest.json

      - name: Create an empty npm user config
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
        run: |
          printf '%s\n' 'registry=https://registry.npmjs.org/' > "$NPM_USERCONFIG"
          chmod 600 "$NPM_USERCONFIG"

      - name: Install the pinned npm 12 release CLI with Trusted Publishing support
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
        run: |
          npm --userconfig "$NPM_USERCONFIG" install --global "npm@${NPM_VERSION}" --no-audit --no-fund
          test "$(npm --version)" = "$NPM_VERSION"

      - name: Require the exact version to be absent
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: node scripts/release-validation.mjs registry-absent --tag "$RELEASE_TAG"

      - name: Publish the exact tarball with npm Trusted Publishing
        env:
          NPM_USERCONFIG: ${{ runner.temp }}/dsh-auth.npmrc
          RELEASE_TAG: ${{ inputs.tag }}
          NPM_REGISTRY: ${{ env.NPM_REGISTRY }}
        run: |
          set -euo pipefail
          RELEASE_VERSION="${RELEASE_TAG#v}"
          TARBALL="./release/dsh-auth-${RELEASE_VERSION}.tgz"
          npm --userconfig "$NPM_USERCONFIG" publish "$TARBALL" \
            --access public \
            --tag latest \
            --provenance \
            --registry "$NPM_REGISTRY"

      - name: Verify the published version and latest tag (publication cannot be rolled back)
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-validation.mjs registry-published --tag "$RELEASE_TAG"
          node scripts/release-validation.mjs registry-smoke --tag "$RELEASE_TAG"

  github-release:
    needs: publish
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: Check out the exact release tag
        uses: actions/checkout@v4
        with:
          ref: refs/tags/${{ inputs.tag }}
          fetch-depth: 0
          persist-credentials: false

      - name: Set up Node 24 without a package cache
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}

      - name: Download the published npm artifact
        uses: actions/download-artifact@v4
        with:
          name: dsh-auth-release
          path: release

      - name: Revalidate tag, npm registry state, artifact, and SHA-256
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          node scripts/release-validation.mjs artifact-verify \
            --tag "$RELEASE_TAG" \
            --directory release \
            --manifest release/manifest.json
          node scripts/release-validation.mjs registry-published --tag "$RELEASE_TAG"

      - name: Create the final GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          if ! gh release create "$RELEASE_TAG" \
              "release/dsh-auth-${RELEASE_TAG#v}.tgz" \
              release/manifest.json \
              --verify-tag \
              --title "$RELEASE_TAG" \
              --notes-file release/release-notes.md; then
            echo 'Release creation did not complete; requiring an existing exact release before success.'
          fi

      - name: Download and verify the final GitHub Release (creation cannot be rolled back automatically)
        env:
          GH_TOKEN: ${{ github.token }}
          RELEASE_TAG: ${{ inputs.tag }}
        run: |
          mkdir published-release
          gh release download "$RELEASE_TAG" --dir published-release
          gh release view "$RELEASE_TAG" \
            --json assets,body,isDraft,isPrerelease,name,tagName \
            > release-metadata.json
          cmp release/manifest.json published-release/manifest.json
          node scripts/release-validation.mjs artifact-verify \
            --tag "$RELEASE_TAG" \
            --directory published-release \
            --manifest published-release/manifest.json
          node scripts/release-validation.mjs github-release \
            --tag "$RELEASE_TAG" \
            --metadata release-metadata.json \
            --notes release/release-notes.md
